plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

base.archivesName = "$mod_id-$mod_version-$minecraft_version"

repositories {
    mavenLocal()
    mavenCentral()
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappingsVersion
        minecraftVersion = parchment_minecraftVersion
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    var coremodProject = stonecutter.node.sibling("coremods")

    implementation(jarJar(project(coremodProject.getPath())))
    implementation(jarJar(group: 'yuuria.stackupper', name: "StackUpperConfigLibrary", version: '[1,)'))
}


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}