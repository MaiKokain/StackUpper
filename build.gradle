plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.137'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
allprojects {
    ext.mod_version = null
}

if (!project.hasProperty("mod_version")) project.setProperty("mod_version", "0.0.0")
base.archivesName = "$mod_id-$mod_version-$minecraft_version"
version = property("mod_version")
//if (project.hasProperty('mod_version')) {
//    base.archivesName = "$mod_id-$mod_version-$minecraft_version"
//} else {
//    base.archivesName = "$mod_id-debug-$minecraft_version"
//}

repositories {
    mavenLocal()
    mavenCentral()
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappingsVersion
        minecraftVersion = parchment_minecraftVersion
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    if (stonecutter.eval(stonecutter.current.version, ">=1.21.4")) {
        jarJar('org.antlr:antlr4-runtime:4.13.2')
    }

    if (stonecutter.eval(stonecutter.current.version, ">=1.21.10")) {
        implementation(jarJar(project(":coremods:1.21.10")))
    } else {
        implementation(jarJar(project(":coremods:1.21")))
    }

    implementation(jarJar(group: 'yuuria.stackupper', name: "StackUpperConfigLibrary", version: '[1,)'))
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : "0.0.0-debug",
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}